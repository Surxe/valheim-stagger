[project]
name = "valheim-stagger"
version = "0.1.0"
description = "Which Valheim weapon (at which upgrade level) can stagger which creature (at which star level), accounting for stagger decay."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vstagger = "valheim_stagger.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valheim_stagger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
